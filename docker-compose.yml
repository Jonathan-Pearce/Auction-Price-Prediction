# =============================================================================
# Auction Price Prediction - Docker Compose
# =============================================================================
# Simplified setup for web scraping and data collection
# Usage: docker-compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Scraper Service - Main container for data collection
  # ---------------------------------------------------------------------------
  dev:
    build:
      context: .
    container_name: auction-scraper-dev
    volumes:
      # Mount source code for live development
      - ./src:/app/src
      # Mount scripts and notebooks
      - ./scripts:/app/scripts
      - ./notebooks:/app/notebooks
      # Mount data directory for persistence
      - ./data:/app/data
      # Mount environment variables
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
    # Keep container running for interactive development
    stdin_open: true
    tty: true
    command: /bin/bash

# =============================================================================
# Volumes - Persist data across container rebuilds
# =============================================================================
volumes:
  auction-data:
    driver: local
