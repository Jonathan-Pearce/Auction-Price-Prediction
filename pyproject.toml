[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-price-prediction"
version = "0.1.0"
description = "Full-stack ML system for predicting MaxSold auction winning prices"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jonathan Pearce"}
]
keywords = ["machine-learning", "auction", "price-prediction", "pytorch", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Data collection and processing
data = [
    "httpx[http2]>=0.25.0",  # HTTP/2 support for better performance
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "pandas>=2.1.0",
    "polars>=0.19.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.9.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
]

# Machine learning and modeling
ml = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=2.15.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

# API and deployment
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "gradio>=4.0.0",
    "huggingface-hub>=0.19.0",
]

# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.11.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "ipykernel>=6.27.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]

# All dependencies
all = [
    "auction-price-prediction[data,ml,api,dev]",
]

[project.urls]
Homepage = "https://github.com/Jonathan-Pearce/Auction-Price-Prediction-"
Repository = "https://github.com/Jonathan-Pearce/Auction-Price-Prediction-"
Documentation = "https://github.com/Jonathan-Pearce/Auction-Price-Prediction-/tree/main/docs"

[project.scripts]
auction-scrape = "src.data.scraper:main"
auction-train = "src.modeling.train:main"
auction-predict = "src.modeling.predict:main"
auction-api = "api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | data
    | models
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "venv",
    "data",
    "models",
    "notebooks",
]

[tool.ruff.isort]
known-first-party = ["src", "api"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = [
    "data/",
    "models/",
    "notebooks/",
    "venv/",
]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "transformers.*",
    "gradio.*",
    "duckdb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src", "api"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
