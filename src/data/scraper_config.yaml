# =============================================================================
# Web Scraping Configuration for MaxSold Auction Data
# =============================================================================
# This YAML file contains all configuration values for the auction data scraping process.
# Including API endpoints, field mappings, rate limiting, and output settings.

# =============================================================================
# API Configuration
# =============================================================================
api:
  # Base URLs
  base_url: "https://maxsold.maxsold.com/msapi"
  enriched_base_url: "https://api.maxsold.com"
  
  # Endpoint templates
  endpoints:
    auction_items: "/auctions/items"
    enriched_item: "/listings/am/{item_id}/enriched"
    enriched_auction: "/sales/am/{auction_id}"
  
  # API parameters
  parameters:
    items_limit: 2500
    timeout: 30  # seconds
    max_retries: 3
    retry_delay: 1.0  # seconds

# =============================================================================
# Rate Limiting Configuration
# =============================================================================
rate_limiting:
  requests_per_second: 20  # Increased for faster scraping
  concurrent_requests: 10  # Increased concurrent processing

# =============================================================================
# Data Field Configuration
# =============================================================================
fields:
  # Auction-level fields to extract from API response
  auction_fields:
    - id
    - title
    - starts
    - ends
    - last_item_closes
    - removal_info
    - intro
    - pickup_time
    - partner_url
    - extended_bidding
    - extended_bidding_interval
    - extended_bidding_threshold
    - catalog_lots
  
  # Item-level fields to aggregate
  item_aggregate_fields:
    - viewed
    - current_bid
    - bid_count
  
  # Item-level fields to extract from API response
  item_fields:
    - id
    - auction_id
    - title
    - description
    - viewed
    - starting_bid
    - current_bid
    - proxy_bid
    - start_time
    - end_time
    - bid_count
    - bidding_extended
  
  # Field name mappings (old_name: new_name)
  field_rename_map:
    catalog_lots: item_count
    current_bid: winning_price
    id: id  # Keep id as-is initially, will add prefix later
  
  # Item field name mappings (old_name: new_name)
  item_field_rename_map:
    id: id
    auction_id: auction_id
  
  # Enriched auction fields to extract from API response
  enriched_auction_fields:
    - amAuctionId
    - type
    - category
    - displayRegion
    - approxLocation
  
  # Enriched auction field name mappings (old_name: new_name)
  enriched_auction_field_rename_map:
    amAuctionId: auction_id
    amLotId: item_id
  
  # Prefix to add to all column names
  column_prefix: "auction_"
  
  # Prefix for item columns
  item_column_prefix: "item_"
  
  # Enriched item fields to extract from API response
  enriched_item_fields:
    - amLotId
    - amAuctionId
  
  # Nested enriched item fields (stored as JSON strings)
  enriched_item_json_fields:
    - brands
    - categories
    - items
    - attributes
    - photosTaken
  
  # Fields extracted from the generatedDescription object
  enriched_item_generated_description_fields:
    - title
    - slug
    - description
    - qualitativeDescription
    - brand
    - seriesLine
    - condition
    - working
    - singleKeyItem
    - numItems
  
  # Enriched item field name mappings (old_name: new_name)
  enriched_item_field_rename_map:
    amLotId: item_id
    amAuctionId: auction_id
  
  # Prefix for enriched item columns
  enriched_item_column_prefix: "enriched_item_"
  # Bid-level fields to extract from API response
  bid_fields:
    - time_of_bid
    - amount
    - isproxy
  
  # Bid field name mappings (old_name: new_name)
  bid_field_rename_map:
    time_of_bid: time
    isproxy: is_proxy
  
  # Prefix for bid columns (exception: auction_id and item_id)
  bid_column_prefix: "bid_"
  # Prefix for enriched auction columns (except auction_id and item_id)
  enriched_auction_column_prefix: "enriched_auction_"

# =============================================================================
# Data Storage Configuration
# =============================================================================
storage:
  # Input data
  input:
    file: "auction_location_data.parquet"
    directory: "data/raw"
    id_column: "amAuctionId"
    # Hugging Face dataset for auction IDs
    hf_dataset_repo: "jpearce610/auction_data"
    hf_auction_id_column: "auction_id"
    # Hugging Face dataset for item IDs (enriched item scraper)
    hf_item_dataset_repo: "jpearce610/item_data"
    hf_item_id_column: "item_id"
  
  # Output data
  output:
    raw_directory: "data/raw/auctions"
    processed_directory: "data/processed/auctions"
    auction_data_filename: "auction_data.parquet"
    item_raw_directory: "data/raw/items"
    item_processed_directory: "data/processed/items"
    item_data_filename: "item_data.parquet"
    enriched_item_raw_directory: "data/raw/enriched_items"
    enriched_item_processed_directory: "data/processed/enriched_items"
    enriched_item_data_filename: "enriched_item_data.parquet"
    bid_raw_directory: "data/raw/bids"
    bid_processed_directory: "data/processed/bids"
    bid_data_filename: "bid_data.parquet"
    enriched_auction_raw_directory: "data/raw/enriched_auctions"
    enriched_auction_processed_directory: "data/processed/enriched_auctions"
    enriched_auction_data_filename: "enriched_auction_data.parquet"
    image_raw_directory: "data/raw/images"
    image_processed_directory: "data/processed/images"
    image_data_filename: "image_embeddings.parquet"
    metadata_filename: "metadata.json"
  
  # Progress tracking
  progress:
    filename: "scraper_progress.json"
    item_progress_filename: "item_scraper_progress.json"
    enriched_item_progress_filename: "enriched_item_scraper_progress.json"
    bid_progress_filename: "bid_scraper_progress.json"
  
  # Hugging Face datasets
  hf_datasets:
    item_data_repo: "jpearce610/item_data"
    item_id_column: "item_id"
    enriched_auction_progress_filename: "enriched_auction_scraper_progress.json"
    image_progress_filename: "image_scraper_progress.json"

# =============================================================================
# Parallel Processing Configuration
# =============================================================================
parallel_processing:
  # Batch processing
  batch:
    default_size: 100
    min_size: 1
    max_size: 1000
  
  # Parallel workers
  workers:
    default_max: 15  # Increased for better parallelism
    min: 1
    max: 50  # Allow more workers if needed

# =============================================================================
# Hugging Face Configuration
# =============================================================================
huggingface:
  # Dataset metadata
  dataset:
    name: "maxsold-auction-data"
    description: "MaxSold auction data with aggregated item metrics"
    license: "cc-by-4.0"
    tags:
      - auction
      - price-prediction
      - e-commerce
      - maxsold
  
  # Item dataset metadata
  item_dataset:
    name: "maxsold-item-data"
    description: "MaxSold auction item data with detailed item information"
    license: "cc-by-4.0"
    tags:
      - auction
      - price-prediction
      - e-commerce
      - maxsold
      - items
  
  # Files to upload
  upload_files:
    - auction_data.parquet
    - metadata.json
  
  # Item files to upload
  item_upload_files:
    - item_data.parquet
    - metadata.json
  
  # Enriched item dataset metadata
  enriched_item_dataset:
    name: "maxsold-enriched-item-data"
    description: "MaxSold enriched item data with detailed item attributes, brands, categories, and metadata"
  # Bid dataset metadata
  bid_dataset:
    name: "maxsold-bid-data"
    description: "MaxSold auction bid history data with bid timing and amounts"
  # Enriched auction dataset metadata
  enriched_auction_dataset:
    name: "maxsold-enriched-auction-data"
    description: "MaxSold enriched auction data with location and category information"
    license: "cc-by-4.0"
    tags:
      - auction
      - price-prediction
      - e-commerce
      - maxsold
      - enriched-items
      - item-attributes
  
  # Enriched item files to upload
  enriched_item_upload_files:
    - enriched_item_data.parquet
      - bids
      - bid-history
  
  # Bid files to upload
  bid_upload_files:
    - bid_data.parquet
      - enriched
      - location
  
  # Enriched auction files to upload
  enriched_auction_upload_files:
    - enriched_auction_data.parquet
    - metadata.json
  
  # Image embedding dataset metadata
  image_dataset:
    name: "maxsold-image-embeddings"
    description: "MaxSold auction item image embeddings extracted using MobileNetV3"
    license: "cc-by-4.0"
    tags:
      - auction
      - price-prediction
      - e-commerce
      - maxsold
      - images
      - embeddings
      - mobilenetv3
  
  # Image files to upload
  image_upload_files:
    - image_embeddings.parquet
    - metadata.json

# =============================================================================
# Image Processing Configuration
# =============================================================================
image_processing:
  # Model configuration
  model:
    onnx_file: "models/mobilenet_v3_small_Opset17.onnx"
    embedding_dim: 576  # Second-to-last layer output dimension
    input_size: 224  # Model input size (224x224)
  
  # Image preprocessing
  preprocessing:
    max_dimension: 224  # Resize to max 224 pixels maintaining aspect ratio
    target_size: [224, 224]  # Final size after padding/cropping
    mean: [0.485, 0.456, 0.406]  # ImageNet normalization mean
    std: [0.229, 0.224, 0.225]  # ImageNet normalization std
  
  # HTTP settings for image download
  http:
    timeout: 15  # Reduced timeout for faster failures
    max_retries: 2  # Reduced retries for faster failure handling
    retry_delay: 0.5  # Faster retry delay

# =============================================================================
# Validation Configuration
# =============================================================================
validation:
  # Required fields in final dataset (after renaming and prefixing)
  required_output_fields:
    - auction_id
    - auction_title
    - auction_item_count
    - auction_total_viewed
    - auction_total_winning_price
    - auction_total_bid_count
    - auction_total_images
  
  # Fields that should be numeric
  numeric_fields:
    - item_count
    - total_viewed
    - total_winning_price
    - total_bid_count
    - total_images
    - extended_bidding_interval
    - extended_bidding_threshold
